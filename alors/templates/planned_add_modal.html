<div class="modal fade" id="add-planned" tabindex="-1"
     aria-labelledby="add-planned-title" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="post" action="{% url 'alors:add_planned' %}" class="js-busy-form">
                {% csrf_token %}
                <div class="modal-header">
                    <h5 class="modal-title" id="add-planned-title">Plan a workout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    {% for field in add_planned_form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}
                                <div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
                            {% endif %}
                            {% for error in field.errors %}
                                <div class="invalid-feedback d-block">{{ error }}</div>
                            {% endfor %}
                        </div>
                    {% endfor %}
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save workout</button>
                </div>
            </form>
        </div>
    </div>
</div>
