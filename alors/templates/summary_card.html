<p>
{% if planned %}
    <b>{{ summary.summary.planned_workouts }}</b> workouts planned over
    <b>{{ summary.summary.planned_distance_km }}km</b>
{% else %}
    <b>{{ summary.summary.workouts }}</b> workouts done over
    <b>{{ summary.summary.workout_distance_km }}km</b> in <b>{{ summary.get_workout_time_as_str }}</b>
{% endif %}
</p>
