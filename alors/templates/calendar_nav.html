    <div class="row">
        <div class="col">
            <ul class="nav nav-underline pb-4">
                <li class="nav-item">
                    <a class="nav-link" href="?d=&r={{ request.GET.r }}#today">Today</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="?d={{ next }}&r={{ request.GET.r }}">Next</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="?d={{ previous }}&r={{ request.GET.r }}">Previous</a>
                </li>
                <li class="nav-item">
                    {% if template == 'monthly' %}
                        <a class="nav-link" href="?r=w">Switch to weekly</a>
                    {% else %}
                        <a class="nav-link" href="?r=m">Switch to monthly</a>
                    {% endif %}
                </li>
            </ul>
        </div>
    </div>
