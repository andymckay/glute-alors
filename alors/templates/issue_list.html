{% extends "base.html" %}
{% load markdown_extras %}
{% block main %}
<div class="container-lg">
    <div class="row">
        <div class="col-lg-7">
            <p>
                <a class="btn btn-primary" href="{% url 'alors:issue_add' %}">Add an issue</a>
            </p>
            <ul class="list-group">
                {% for issue in issues %}
                    <li class="list-group-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <a href="{% url 'alors:issue_edit' issue.pk %}"><span class="badge text-bg-{{ issue.colour }}">{{ issue.title }}</span></a>
                            </div>
                        </div>
                    </li>
                {% empty %}
                    <li class="list-group-item">No issues yet. <a href="{% url 'alors:issue_add' %}">Add one</a>.</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</div>
{% endblock %}
