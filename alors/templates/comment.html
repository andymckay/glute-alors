{% load markdown_extras %}    
<div class="card mt-2">
        <div class="card-body py-2">
            <div class="d-flex justify-content-between align-items-baseline">
                <strong>
                {% if comment.created_by.profile.avatar %}
                    <img src="{{ comment.created_by.profile.avatar.url }}" alt="{{ user }}" class="rounded-circle me-1" width="24" height="24">
                {% endif %}
                {{ comment.created_by|default:"Anonymous" }}</strong>
                <small class="text-muted">{{ comment.created_at }}</small>
            </div>
            <div class="mt-1">{{ comment.text|markdown }}</div>
        </div>
    </div>
