{% load alors %}
{% load markdown_extras %}
<div class="card card-event card-compact">
    <a href="{% url 'weights:workout_perform' workout.pk %}#all" class="link-underline link-underline-opacity-0 link-card-hack">
        <div class="card-body text-muted">
            <div class="mb-2">
                {{ workout.workout_type|emoji }}
                <span class="text-muted">{{ workout.title|capfirst }}</span>
                <div>
                    <b>{{ workout.completed_set_count }} of {{ workout.set_count }}</b><br>
                    <b>{{ workout.elapsed_seconds|hms }}</b>
                </div>
            </div>
        </div>
    </a>
    {% if not workout.completed %}
        <div class="card-footer">
            <a class="badge bg-warning link-underline link-underline-opacity-0" href="{% url 'weights:workout_perform' workout.pk %}#all">Resume</a>
            <form method="post" action="{% url 'weights:workout_delete' workout.pk %}" class="d-inline js-busy-form" data-confirm="Delete this weights workout?">
                {% csrf_token %}
                <button type="submit" class="badge bg-danger border-0 link-underline link-underline-opacity-0">Delete</button>
            </form>
        </div>
    {% endif %}
</div>
