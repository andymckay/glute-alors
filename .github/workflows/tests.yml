name: Unit Tests
on: push 

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - run: pip install -r requirements.txt
      - run: |
          touch .env
          echo DATABASE_URL=sqlite:///db.sqlite3
          cat .env
      - run: python manage.py test