; Supervisor configuration to run the glute project with Gunicorn on port 8000.
; Start the daemon with:
;   supervisord -c glute/supervisorctl.conf
; Control it with supervisorctl (status/start/stop/restart).

[supervisord]
logfile=/tmp/glute-supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/glute-supervisord.pid
nodaemon=false

[unix_http_server]
file=/tmp/glute-supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/glute-supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:glute]
directory=/home/admin/glute-alors
command=/home/admin/glute-alors/.venv/bin/gunicorn --bind 127.0.0.1:8000 --workers 2 --access-logfile - glute.wsgi:application
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/tmp/glute-gunicorn.log
stderr_logfile=/tmp/glute-gunicorn-error.log
